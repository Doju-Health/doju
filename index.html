<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/favicon.jpg" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <meta name="theme-color" content="#0f2d4a" />

    <!-- Primary SEO -->
    <title>Doju Health - Medical Equipment Marketplace Nigeria</title>
    <meta
      name="description"
      content="Doju Health is Nigeria's trusted marketplace for clinical-grade medical equipment and health supplies. Buy verified, FDA-compliant devices from certified sellers with fast delivery across Africa."
    />
    <meta name="author" content="Doju Health" />
    <meta
      name="keywords"
      content="medical equipment Nigeria, buy medical supplies online, clinical grade medical devices, health equipment marketplace, hospital equipment Nigeria, doju health, medical shop Nigeria, FDA compliant medical equipment, healthcare supplies Africa"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://dojuhealth.com/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Doju Health" />
    <meta
      property="og:title"
      content="Doju Health - Medical Equipment Marketplace Nigeria"
    />
    <meta
      property="og:description"
      content="Nigeria's trusted marketplace for clinical-grade medical equipment. Verified sellers, FDA-compliant products, fast delivery across Africa."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://dojuhealth.com/" />
    <meta property="og:image" content="https://dojuhealth.com/favicon.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@DojuHealth" />
    <meta
      name="twitter:title"
      content="Doju Health - Medical Equipment Marketplace Nigeria"
    />
    <meta
      name="twitter:description"
      content="Nigeria's trusted marketplace for clinical-grade medical equipment. Verified sellers, FDA-compliant products, fast delivery."
    />
    <meta name="twitter:image" content="https://dojuhealth.com/favicon.jpg" />

    <!-- Structured Data: Organization -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Doju Health",
        "url": "https://dojuhealth.com",
        "logo": "https://dojuhealth.com/favicon.jpg",
        "description": "Nigeria's trusted marketplace for clinical-grade medical equipment and health supplies.",
        "foundingLocation": {
          "@type": "Place",
          "name": "Nigeria"
        },
        "areaServed": {
          "@type": "Continent",
          "name": "Africa"
        },
        "sameAs": ["https://twitter.com/DojuHealth"],
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer support",
          "availableLanguage": "English"
        }
      }
    </script>

    <!-- Structured Data: WebSite with SearchAction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Doju Health",
        "url": "https://dojuhealth.com",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://dojuhealth.com/marketplace?search={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>

  <body
    style="margin: 0; min-height: 100vh; min-height: -webkit-fill-available"
  >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.onerror = function (msg, src, line, col, err) {
        document.body.style.background = "white";
        document.body.innerHTML =
          '<div style="padding:20px;font-family:sans-serif;color:red;font-size:14px">' +
          "<b>Error:</b> " +
          msg +
          "<br/>" +
          "<b>File:</b> " +
          src +
          "<br/>" +
          "<b>Line:</b> " +
          line +
          "</div>";
      };
    </script>
  </body>
</html>
